name: tests

# Proves the tool really is cross-platform by running the same test suite
# on Linux, macOS and Windows on every push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel the other jobs when one fails: if something breaks on
      # Windows only, it is useful to see that Linux and macOS still passed.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
        include:
          # Also check the oldest supported version, so the README claim of
          # "Python 3.9+" stays true.
          - os: ubuntu-latest
            python-version: "3.9"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest -v

      - name: Smoke test the command line tool
        # Confirms the tool itself runs, not just its functions.
        run: python -m ssh_analyser samples/auth_bruteforce.log --year 2026
